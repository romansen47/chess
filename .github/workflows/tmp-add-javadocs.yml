name: Temporary Javadoc generation

on:
  push:
    branches: [work]

permissions:
  contents: write

jobs:
  document:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Java parser
        run: python3 -m pip install --quiet tree_sitter tree_sitter_java
      - name: Add English Javadoc without changing code tokens
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from tree_sitter import Language, Parser
          import tree_sitter_java

          LANGUAGE = Language(tree_sitter_java.language())
          PARSER = Parser(LANGUAGE)
          METHOD_TYPES = {"method_declaration", "constructor_declaration", "compact_constructor_declaration"}
          COMMENT_TYPES = {"line_comment", "block_comment"}

          def humanize(name: str) -> str:
              value = re.sub(r'([a-z0-9])([A-Z])', r'\1 \2', name.replace('_', ' '))
              value = re.sub(r'\s+', ' ', value).strip().lower()
              return value or "value"

          def subject_after(prefix: str, name: str) -> str:
              tail = name[len(prefix):]
              return humanize(tail) if tail else humanize(name)

          def method_description(name: str, constructor: bool, class_name: str | None) -> str:
              if constructor:
                  return f"Creates a new {class_name or name} instance."
              special = {
                  "main": "Starts the application.",
                  "toString": "Returns a string representation of this object.",
                  "hashCode": "Returns the hash code for this object.",
                  "equals": "Compares this object with another object for equality.",
                  "clone": "Creates a copy of this object.",
              }
              if name in special:
                  return special[name]
              rules = [
                  ("get", "Returns the {s}."), ("is", "Returns whether the {s}."),
                  ("has", "Returns whether this object has the {s}."), ("can", "Returns whether this object can {s}."),
                  ("set", "Sets the {s}."), ("create", "Creates the {s}."),
                  ("build", "Builds the {s}."), ("new", "Creates the {s}."),
                  ("load", "Loads the {s}."), ("save", "Saves the {s}."),
                  ("read", "Reads the {s}."), ("write", "Writes the {s}."),
                  ("find", "Finds the {s}."), ("resolve", "Resolves the {s}."),
                  ("calculate", "Calculates the {s}."), ("compute", "Computes the {s}."),
                  ("evaluate", "Evaluates the {s}."), ("parse", "Parses the {s}."),
                  ("format", "Formats the {s}."), ("convert", "Converts the {s}."),
                  ("map", "Maps the {s}."), ("update", "Updates the {s}."),
                  ("reset", "Resets the {s}."), ("clear", "Clears the {s}."),
                  ("add", "Adds the {s}."), ("remove", "Removes the {s}."),
                  ("delete", "Deletes the {s}."), ("start", "Starts the {s}."),
                  ("stop", "Stops the {s}."), ("close", "Closes the {s}."),
                  ("open", "Opens the {s}."), ("register", "Registers the {s}."),
                  ("unregister", "Unregisters the {s}."), ("apply", "Applies the {s}."),
                  ("validate", "Validates the {s}."), ("check", "Checks the {s}."),
                  ("handle", "Handles the {s}."), ("process", "Processes the {s}."),
                  ("perform", "Performs the {s}."), ("execute", "Executes the {s}."),
              ]
              for prefix, template in rules:
                  if name.startswith(prefix) and len(name) > len(prefix):
                      return template.format(s=subject_after(prefix, name))
              return f"Performs the {humanize(name)} operation."

          def named_descendants(node, node_type: str):
              result = []
              stack = [node]
              while stack:
                  current = stack.pop()
                  if current.type == node_type:
                      result.append(current)
                  stack.extend(reversed(current.named_children))
              return result

          def class_name_for(node, source: bytes):
              current = node.parent
              while current is not None:
                  if current.type in {"class_declaration", "interface_declaration", "enum_declaration", "record_declaration"}:
                      name_node = current.child_by_field_name("name")
                      return source[name_node.start_byte:name_node.end_byte].decode() if name_node else None
                  current = current.parent
              return None

          def code_tokens(source: bytes):
              tree = PARSER.parse(source)
              if tree.root_node.has_error:
                  raise RuntimeError("Java parse error while verifying source")
              out = []
              stack = [tree.root_node]
              while stack:
                  node = stack.pop()
                  if node.type in COMMENT_TYPES:
                      continue
                  if node.child_count == 0:
                      out.append(source[node.start_byte:node.end_byte])
                  else:
                      stack.extend(reversed(node.children))
              return out

          def javadoc_for(node, source: bytes, indent: str):
              constructor = node.type != "method_declaration"
              name_node = node.child_by_field_name("name")
              class_name = class_name_for(node, source)
              name = source[name_node.start_byte:name_node.end_byte].decode() if name_node else (class_name or "constructor")
              lines = ["/**", f" * {method_description(name, constructor, class_name)}"]

              type_params = node.child_by_field_name("type_parameters")
              if type_params:
                  for tp in named_descendants(type_params, "type_parameter"):
                      n = tp.child_by_field_name("name")
                      if n:
                          p = source[n.start_byte:n.end_byte].decode()
                          lines.append(f" * @param <{p}> the type parameter")

              params = node.child_by_field_name("parameters")
              if params:
                  for pnode in params.named_children:
                      if pnode.type not in {"formal_parameter", "spread_parameter", "receiver_parameter"}:
                          continue
                      n = pnode.child_by_field_name("name")
                      if n:
                          p = source[n.start_byte:n.end_byte].decode()
                          lines.append(f" * @param {p} the {humanize(p)}")

              if not constructor:
                  return_type = node.child_by_field_name("type")
                  if return_type:
                      r = source[return_type.start_byte:return_type.end_byte].decode().strip()
                      if r != "void":
                          if name.startswith("get") and len(name) > 3:
                              ret = f"the {subject_after('get', name)}"
                          elif name.startswith(("is", "has", "can")):
                              ret = "true when the condition is satisfied; otherwise false"
                          else:
                              ret = "the result of the operation"
                          lines.append(f" * @return {ret}")

              lines.append(" */")
              return ("\n" + indent).join(lines)

          total = 0
          for path in sorted(Path('src/main/java').rglob('*.java')):
              original = path.read_bytes()
              before_tokens = code_tokens(original)
              tree = PARSER.parse(original)
              methods = []
              stack = [tree.root_node]
              while stack:
                  node = stack.pop()
                  if node.type in METHOD_TYPES:
                      methods.append(node)
                  stack.extend(reversed(node.named_children))

              edits = []
              for node in methods:
                  line_start = original.rfind(b'\n', 0, node.start_byte) + 1
                  indent_bytes = original[line_start:node.start_byte]
                  if any(ch not in b' \t' for ch in indent_bytes):
                      indent_bytes = b''
                  indent = indent_bytes.decode('utf-8')
                  doc = javadoc_for(node, original, indent).encode('utf-8')

                  prefix = original[:node.start_byte]
                  doc_start = prefix.rfind(b'/**')
                  replaced = False
                  if doc_start >= 0:
                      doc_end = prefix.find(b'*/', doc_start)
                      if doc_end >= 0 and prefix[doc_end + 2:].strip() == b'':
                          edits.append((doc_start, doc_end + 2, doc))
                          replaced = True
                  if not replaced:
                      edits.append((node.start_byte, node.start_byte, doc + b'\n' + indent_bytes))

              updated = original
              for start, end, replacement in sorted(edits, reverse=True):
                  updated = updated[:start] + replacement + updated[end:]

              after_tokens = code_tokens(updated)
              if before_tokens != after_tokens:
                  raise RuntimeError(f"NON-COMMENT JAVA TOKENS CHANGED: {path}")

              if updated != original:
                  path.write_bytes(updated)
              total += len(methods)
              print(f"{path}: documented {len(methods)} methods/constructors; code tokens unchanged")

          print(f"Documented {total} methods/constructors in production Java sources.")
          workflow = Path('.github/workflows/tmp-add-javadocs.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Add English Javadoc to Java methods'
          git push origin work
